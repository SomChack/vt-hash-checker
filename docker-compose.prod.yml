# Compose для сервера: образ приложения берётся из реестра (его собирает пайплайн),
# nginx проксирует и терминирует TLS, certbot выпускает/продлевает сертификат.
# Перед первым запуском выпустите сертификат: ./scripts/init-letsencrypt.sh <домен> <email>
services:
  vt-hash-checker:
    image: ${IMAGE}:${TAG:-latest}
    container_name: vt-hash-checker
    restart: unless-stopped
    # Порт 8000 наружу НЕ публикуется: к приложению ходит только nginx по внутренней сети.
    expose:
      - "8000"
    # Доверять X-Forwarded-* безопасно только пока порт 8000 недоступен снаружи.
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-server-header
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
    env_file:
      - .env
    volumes:
      - ./data:/data
      - ./logs:/logs

  nginx:
    image: nginx:1.27-alpine
    container_name: vt-hash-checker-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SERVER_NAME: vt-hash-checker.duckdns.org
      SSL_CERT: /etc/letsencrypt/live/vt-hash-checker.duckdns.org/fullchain.pem
      SSL_CERT_KEY: /etc/letsencrypt/live/vt-hash-checker.duckdns.org/privkey.pem
      APP_UPSTREAM: vt-hash-checker:8000
      HSTS_MAX_AGE: "31536000"   # после успешной проверки; начните с 300, затем поднимите
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - vt-hash-checker

  certbot:
    image: certbot/certbot
    container_name: vt-hash-checker-certbot
    restart: unless-stopped
    # Проверяем сертификаты раз в 12 часов; renew продлевает только близкие к истечению.
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}VT Hash Checker{% endblock %}</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/static/icon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/static/icon-180.png">
  <link rel="stylesheet" href="/static/style.css?v={{ css_version }}">
</head>
<body>
{% set on_comments = request.url.path == '/comments' %}
<div class="layout">
  <aside class="sidebar">
    <a class="brand" href="/">
      <span class="brand-name">VT Hash Checker</span>
      <span class="brand-sub">Отчёты VirusTotal по хэшу</span>
    </a>
    <nav class="menu" aria-label="Разделы">
      <a href="/" class="menu-item{% if not on_comments %} active{% endif %}"{% if not on_comments %} aria-current="page"{% endif %}>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        Проверка хэша
      </a>
      <a href="/comments" class="menu-item{% if on_comments %} active{% endif %}"{% if on_comments %} aria-current="page"{% endif %}>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
        Комментарии
      </a>
    </nav>
  </aside>

  <div class="content">
    <header class="page-head">
      <h1>{% block heading %}{% endblock %}</h1>
      <p>{% block subheading %}{% endblock %}</p>
    </header>
    <main class="wrap">
      {% block content %}{% endblock %}
    </main>
  </div>
</div>
</body>
</html>

name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:        # позволяет запустить деплой вручную из вкладки Actions

# Два деплоя одновременно не запускаем: новый ждёт завершения текущего
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  DEPLOY_PATH: /home/deploy/vt-hash-checker   # папка на сервере, где лежат compose-файл и .env

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # право пушить образ в GitHub Container Registry
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # Имя образа в GHCR обязано быть в нижнем регистре
      - name: Compute image name
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read        # право скачивать образ из GHCR (нужно серверу при docker pull)
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload compose file
        run: |
          ssh "$SSH_USER@$SSH_HOST" "mkdir -p $DEPLOY_PATH"
          scp docker-compose.prod.yml "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/docker-compose.yml"

      # Токен уходит на сервер через stdin (не попадает в аргументы и логи)
      # и нужен только чтобы сервер мог скачать образ из приватного GHCR.
      - name: Pull new image and restart
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          TAG: ${{ github.sha }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | ssh "$SSH_USER@$SSH_HOST" \
            "docker login ghcr.io -u $REGISTRY_USER --password-stdin \
             && cd $DEPLOY_PATH \
             && export IMAGE=$IMAGE TAG=$TAG \
             && docker compose pull \
             && docker compose up -d \
             && docker image prune -f"
